version: '3.8'

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: onto-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP UI (Neo4j Browser)
      - "7687:7687"  # Bolt 프로토콜
    environment:
      - NEO4J_AUTH=neo4j/Ontology2026!
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    networks:
      - graph-network

  fuseki:
    image: stain/jena-fuseki:latest
    container_name: onto-fuseki
    restart: unless-stopped
    ports:
      - "3030:3030"  # SPARQL UI & Web API
    environment:
      - ADMIN_PASSWORD=admin
    volumes:
      - ./data/fuseki:/fuseki
    networks:
      - graph-network

  postgres:
    image: postgres:18
    container_name: onto-postgres
    restart: unless-stopped
    ports:
      - "55432:5432"  # 로컬에 이미 Postgres 가 있어도 충돌하지 않게 55432 로 연다
    environment:
      - POSTGRES_USER=onto
      - POSTGRES_PASSWORD=Ontology2026!
      - POSTGRES_DB=factory
    volumes:
      - ./data/postgres:/var/lib/postgresql
    networks:
      - graph-network

networks:
  graph-network:
    driver: bridge
