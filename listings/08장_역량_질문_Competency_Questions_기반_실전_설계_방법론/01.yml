# specs/competency_questions.yaml
domain: Manufacturing_Assembly_Ops
version: 1.0.0

competency_questions:
  - id: CQ-01
    question: "지난주 지연된 작업 지시는 어느 설비에서 발생했는가?"
    required_concepts: [WorkOrder, Equipment, DelayEvent]
    requester: "생산관리팀"
    target_ui: "설비 장애 분석 대시보드"

  - id: CQ-02
    question: "특정 로봇 설비에 장착된 핵심 부품의 교체 이력은 어떠한가?"
    required_concepts: [Equipment, Part, ReplacementHistory]
    requester: "보전엔지니어링팀"
    target_ui: "예지보전 관제 뷰어"

out_of_scope:
  - concept: "센서 원시 시계열 진동 신호"
    reason: "초당 1,000건의 원시 데이터는 시계열 TSDB(InfluxDB) 전담 영역임"
  - concept: "월말 회계 결산 분개 전표"
    reason: "ERP 원장의 고유 영역이며 본 공장 운영 온톨로지 범위 제외"
