version: '3.8'

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: onto-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP UI (Neo4j Browser)
      - "7687:7687"  # Bolt 바이너리 프로토콜
    environment:
      - NEO4J_AUTH=neo4j/Ontology2026!
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    networks:
      - graph-network

  fuseki:
    image: stain/jena-fuseki:latest
    container_name: onto-fuseki
    restart: unless-stopped
    ports:
      - "3030:3030"  # SPARQL 웹 UI 및 REST 엔드포인트
    environment:
      - ADMIN_PASSWORD=admin
    volumes:
      - ./data/fuseki:/fuseki
    networks:
      - graph-network

networks:
  graph-network:
    driver: bridge
