# 실전 조직 진단 체크리스트 프레임워크
지표_정의_신호 (Metric Definition Signals):
  - Q1: 같은 비즈니스 지표(매출, 활성자, 전환율)가 부서마다 다른 숫자로 보고되는가?
  - Q2: 특정 지표의 정확한 계산식을 확인하기 위해 과거 담당자나 SQL 작성자를 찾아야 하는가?
  - Q3: 새로운 대시보드나 리포트를 만들 때마다 기존 SQL 쿼리를 복사해 붙여넣고 있는가?

관계_추적_신호 (Relationship Traversal Signals):
  - Q4: 2단계 이상(3홉 이상)의 관계를 역추적하거나 연결하는 질문이 현업에서 반복되는가?
  - Q5: 동일한 실세계 개체가 이종 시스템마다 서로 다른 키(Key)와 스키마로 분절되어 존재하는가?
  - Q6: 시스템 장애나 정책 변경 시 영향도 분석(Impact Analysis)을 사람이 수작업으로 파악하는가?
